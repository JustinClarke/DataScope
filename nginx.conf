server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cross-origin isolation unlocks SharedArrayBuffer for DuckDB-Wasm's
    # threaded build (see vite.config.ts) — without these, DuckDB falls back
    # to its slower single-threaded bundle.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
