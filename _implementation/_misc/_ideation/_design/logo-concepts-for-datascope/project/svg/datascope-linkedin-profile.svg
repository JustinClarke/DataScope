<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Canvas Background -->
  <rect width="400" height="400" fill="#141216"/>
  
  <!-- LinkedIn Profile / Company Logo Squircle Container -->
  <rect x="36" y="36" width="328" height="328" rx="72" ry="72" fill="#0B0A0C" stroke="#262229" stroke-width="4"/>
  
  <!-- Reticle Logo Mark -->
  <g transform="translate(70, 70) scale(2.6)">
    <!-- Outer Ring -->
    <circle cx="50" cy="50" r="30" fill="none" stroke="#EDEAE6" stroke-width="9"/>
    
    <!-- Crosshair Ticks -->
    <path d="M50 4 V15 M50 85 V96 M4 50 H15 M85 50 H96" stroke="#EDEAE6" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Pie Sector (Amber) -->
    <path d="M50 50 L50 20 A30 30 0 0 1 76 65 Z" fill="#F2A33C"/>
    
    <!-- Center Dot (Violet) -->
    <circle cx="50" cy="50" r="10" fill="#8B5CF6"/>
  </g>
</svg>
