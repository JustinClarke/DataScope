<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&amp;display=swap');
    .wordmark { font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 72px; letter-spacing: -0.035em; }
    .data-text { fill: #EDEAE6; }
    .scope-text { fill: #F2A33C; }
  </style>

  <!-- Dark Background -->
  <rect width="600" height="200" rx="16" fill="#0B0A0C"/>

  <!-- Centered Reticle-for-O Lockup Group -->
  <g transform="translate(68, 64)">
    <text x="0" y="70" class="wordmark data-text">Data</text>
    <text x="162" y="70" class="wordmark scope-text">Sc</text>
    
    <!-- Reticle 'o' -->
    <g transform="translate(246, 18) scale(0.55)">
      <circle cx="50" cy="50" r="30" fill="none" stroke="#EDEAE6" stroke-width="9"/>
      <path d="M50 4 V15 M50 85 V96 M4 50 H15 M85 50 H96" stroke="#EDEAE6" stroke-width="7" stroke-linecap="round"/>
      <path d="M50 50 L50 20 A30 30 0 0 1 76 65 Z" fill="#F2A33C"/>
      <circle cx="50" cy="50" r="10" fill="#8B5CF6"/>
    </g>

    <text x="306" y="70" class="wordmark scope-text">pe</text>
  </g>
</svg>
