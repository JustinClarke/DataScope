<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { margin: 0; padding: 0; }

  #banner {
    width: 1584px;
    height: 396px;
    position: relative;
    background: #0B0A0C;
    overflow: hidden;
    font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ═══ BACKGROUND LAYERS ═══ */

  /* Subtle radial noise texture */
  .bg-noise {
    position: absolute;
    inset: 0;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 200px 200px;
  }

  /* Horizontal scanlines — very faint */
  .bg-scanlines {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent 0,
      transparent 2px,
      rgba(237, 234, 230, 0.012) 2px,
      rgba(237, 234, 230, 0.012) 3px
    );
    pointer-events: none;
  }

  /* Primary ambient: warm amber glow, top-right */
  .glow-primary {
    position: absolute;
    top: -180px;
    right: 80px;
    width: 800px;
    height: 700px;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(242, 163, 60, 0.10) 0%, transparent 70%);
    pointer-events: none;
    filter: blur(40px);
  }

  /* Secondary ambient: violet glow, bottom-left offset */
  .glow-secondary {
    position: absolute;
    bottom: -200px;
    left: 300px;
    width: 700px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(139, 92, 246, 0.08) 0%, transparent 70%);
    pointer-events: none;
    filter: blur(50px);
  }

  /* Tertiary glow: teal accent, far right edge */
  .glow-tertiary {
    position: absolute;
    top: 50px;
    right: -100px;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(23, 179, 190, 0.06) 0%, transparent 70%);
    pointer-events: none;
    filter: blur(30px);
  }

  /* ═══ DECORATIVE DATA MOTIFS ═══ */

  /* Reticle radar rings (subtle, left-center) */
  .radar-decoration {
    position: absolute;
    left: 340px;
    top: 50%;
    transform: translateY(-50%);
    opacity: 0.12;
    pointer-events: none;
  }

  /* Abstract dot matrix — sparse, elegant */
  .dot-matrix {
    position: absolute;
    top: 60px;
    left: 260px;
    display: grid;
    grid-template-columns: repeat(12, 8px);
    gap: 12px;
    opacity: 0.2;
    pointer-events: none;
    transform: rotate(-5deg);
  }
  .dot-matrix .dot {
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: #EDEAE6;
  }
  .dot-matrix .dot.amber { background: #F2A33C; }
  .dot-matrix .dot.violet { background: #8B5CF6; }
  .dot-matrix .dot.dim { opacity: 0.3; }
  .dot-matrix .dot.mid { opacity: 0.6; }

  /* Thin horizontal data lines — left side ambiance */
  .data-lines {
    position: absolute;
    left: 60px;
    top: 80px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    opacity: 0.08;
    pointer-events: none;
  }
  .data-line {
    height: 1.5px;
    border-radius: 1px;
    background: linear-gradient(90deg, transparent, #EDEAE6 20%, #EDEAE6 80%, transparent);
  }

  /* Floating metric chips — scattered subtly in left zone */
  .metric-chip {
    position: absolute;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.06em;
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.06);
    background: rgba(20, 18, 22, 0.5);
    backdrop-filter: blur(8px);
    pointer-events: none;
    white-space: nowrap;
  }

  /* Bottom accent line */
  .bottom-accent {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(
      90deg,
      transparent 0%,
      rgba(139, 92, 246, 0.3) 15%,
      rgba(242, 163, 60, 0.7) 45%,
      rgba(242, 163, 60, 0.9) 55%,
      rgba(237, 234, 230, 0.3) 85%,
      transparent 100%
    );
  }

  /* ═══ MAIN CONTENT — right-biased layout ═══ */

  .content {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    width: 58%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-end;
    padding-right: 80px;
    z-index: 20;
  }

  /* Wordmark lockup — exact Turn 4 spec */
  .wordmark {
    display: flex;
    align-items: center;
  }
  .wm-data {
    font-size: 76px;
    font-weight: 700;
    letter-spacing: -0.035em;
    color: #EDEAE6;
    line-height: 1;
  }
  .wm-scope {
    font-size: 76px;
    font-weight: 700;
    letter-spacing: -0.035em;
    color: #F2A33C;
    line-height: 1;
  }
  .reticle-o {
    width: 57px;
    height: 57px;
    margin: 5px -2px 0 0;
  }

  /* Tagline */
  .tagline {
    font-size: 19px;
    font-weight: 400;
    letter-spacing: 0.01em;
    color: #918B97;
    margin-top: 14px;
    text-align: right;
  }

  /* Thin divider */
  .divider {
    width: 100%;
    max-width: 540px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(237, 234, 230, 0.12), transparent);
    margin-top: 20px;
  }

  /* Capability pills */
  .capabilities {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 18px;
  }
  .cap-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 6px 14px;
    border-radius: 100px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: #EDEAE6;
    white-space: nowrap;
    border: 1px solid;
  }
  .cap-pill .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .cap-amber { background: rgba(242, 163, 60, 0.08); border-color: rgba(242, 163, 60, 0.25); }
  .cap-amber .dot { background: #F2A33C; }
  .cap-violet { background: rgba(139, 92, 246, 0.08); border-color: rgba(139, 92, 246, 0.25); }
  .cap-violet .dot { background: #8B5CF6; }
  .cap-teal { background: rgba(23, 179, 190, 0.08); border-color: rgba(23, 179, 190, 0.25); }
  .cap-teal .dot { background: #17B3BE; }
</style>
</head>
<body>

<div id="banner">
  <!-- Background layers -->
  <div class="bg-noise"></div>
  <div class="bg-scanlines"></div>
  <div class="glow-primary"></div>
  <div class="glow-secondary"></div>
  <div class="glow-tertiary"></div>

  <!-- Decorative radar reticle rings (left-center) -->
  <div class="radar-decoration">
    <svg width="300" height="300" viewBox="0 0 300 300">
      <!-- Concentric rings -->
      <circle cx="150" cy="150" r="140" fill="none" stroke="#EDEAE6" stroke-width="0.6" stroke-dasharray="3 8"/>
      <circle cx="150" cy="150" r="100" fill="none" stroke="#EDEAE6" stroke-width="0.8"/>
      <circle cx="150" cy="150" r="60" fill="none" stroke="#F2A33C" stroke-width="0.6"/>
      <circle cx="150" cy="150" r="25" fill="none" stroke="#8B5CF6" stroke-width="0.5"/>

      <!-- Crosshair axes -->
      <line x1="150" y1="10" x2="150" y2="290" stroke="#EDEAE6" stroke-width="0.4" opacity="0.5"/>
      <line x1="10" y1="150" x2="290" y2="150" stroke="#EDEAE6" stroke-width="0.4" opacity="0.5"/>
      <line x1="50" y1="50" x2="250" y2="250" stroke="#EDEAE6" stroke-width="0.3" opacity="0.25"/>
      <line x1="250" y1="50" x2="50" y2="250" stroke="#EDEAE6" stroke-width="0.3" opacity="0.25"/>

      <!-- Data wedge -->
      <path d="M 150 150 L 150 50 A 100 100 0 0 1 237 200 Z" fill="#F2A33C" opacity="0.08"/>

      <!-- Data points scattered on the radar -->
      <circle cx="180" cy="80" r="3" fill="#F2A33C" opacity="0.6"/>
      <circle cx="220" cy="130" r="2.5" fill="#8B5CF6" opacity="0.5"/>
      <circle cx="190" cy="190" r="2" fill="#17B3BE" opacity="0.5"/>
      <circle cx="100" cy="110" r="2" fill="#EDEAE6" opacity="0.4"/>
      <circle cx="130" cy="200" r="2.5" fill="#F2A33C" opacity="0.4"/>

      <!-- Center dot -->
      <circle cx="150" cy="150" r="4" fill="#8B5CF6" opacity="0.7"/>
    </svg>
  </div>

  <!-- Sparse dot matrix -->
  <div class="dot-matrix">
    <div class="dot dim"></div><div class="dot"></div><div class="dot dim"></div><div class="dot amber mid"></div><div class="dot dim"></div><div class="dot"></div><div class="dot dim"></div><div class="dot violet"></div><div class="dot dim"></div><div class="dot"></div><div class="dot dim"></div><div class="dot dim"></div>
    <div class="dot"></div><div class="dot dim"></div><div class="dot violet mid"></div><div class="dot dim"></div><div class="dot"></div><div class="dot dim"></div><div class="dot amber"></div><div class="dot dim"></div><div class="dot"></div><div class="dot dim"></div><div class="dot"></div><div class="dot dim"></div>
    <div class="dot dim"></div><div class="dot amber mid"></div><div class="dot dim"></div><div class="dot"></div><div class="dot dim"></div><div class="dot"></div><div class="dot dim"></div><div class="dot"></div><div class="dot violet mid"></div><div class="dot dim"></div><div class="dot amber dim"></div><div class="dot"></div>
    <div class="dot"></div><div class="dot dim"></div><div class="dot"></div><div class="dot dim"></div><div class="dot violet"></div><div class="dot dim"></div><div class="dot"></div><div class="dot dim"></div><div class="dot"></div><div class="dot amber mid"></div><div class="dot dim"></div><div class="dot dim"></div>
    <div class="dot dim"></div><div class="dot"></div><div class="dot dim"></div><div class="dot amber"></div><div class="dot dim"></div><div class="dot"></div><div class="dot dim"></div><div class="dot violet dim"></div><div class="dot dim"></div><div class="dot"></div><div class="dot"></div><div class="dot dim"></div>
  </div>

  <!-- Thin horizontal data lines -->
  <div class="data-lines">
    <div class="data-line" style="width: 220px"></div>
    <div class="data-line" style="width: 160px"></div>
    <div class="data-line" style="width: 280px"></div>
    <div class="data-line" style="width: 120px"></div>
    <div class="data-line" style="width: 200px"></div>
    <div class="data-line" style="width: 90px"></div>
    <div class="data-line" style="width: 250px"></div>
    <div class="data-line" style="width: 170px"></div>
    <div class="data-line" style="width: 140px"></div>
    <div class="data-line" style="width: 210px"></div>
    <div class="data-line" style="width: 100px"></div>
  </div>

  <!-- Floating metric chips (subtle left-zone atmosphere) -->
  <div class="metric-chip" style="left: 80px; top: 60px; color: #F2A33C; opacity: 0.35;">
    <span style="color: #6C6670">ROWS</span>&nbsp; 1.2M
  </div>
  <div class="metric-chip" style="left: 200px; top: 160px; color: #8B5CF6; opacity: 0.25;">
    <span style="color: #6C6670">SCHEMA</span>&nbsp; 4 TABLES
  </div>
  <div class="metric-chip" style="left: 120px; top: 270px; color: #17B3BE; opacity: 0.2;">
    <span style="color: #6C6670">UPLOAD</span>&nbsp; ZERO
  </div>
  <div class="metric-chip" style="left: 320px; top: 310px; color: #F2A33C; opacity: 0.15;">
    <span style="color: #6C6670">ENGINE</span>&nbsp; DUCKDB-WASM
  </div>

  <!-- ═══ MAIN CONTENT ═══ -->
  <div class="content">

    <!-- Reticle-for-O wordmark lockup -->
    <div class="wordmark">
      <div class="wm-data">Data</div>
      <div class="wm-scope">Sc</div>
      <svg class="reticle-o" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="30" fill="none" stroke="#EDEAE6" stroke-width="9"/>
        <path d="M50 4 V15 M50 85 V96 M4 50 H15 M85 50 H96" stroke="#EDEAE6" stroke-width="7" stroke-linecap="round"/>
        <path d="M50 50 L50 20 A30 30 0 0 1 76 65 Z" fill="#F2A33C"/>
        <circle cx="50" cy="50" r="10" fill="#8B5CF6"/>
      </svg>
      <div class="wm-scope">pe</div>
    </div>

    <!-- Tagline -->
    <div class="tagline">Browser-Native Data Profiling &amp; Analytics Workspace</div>

    <!-- Thin divider -->
    <div class="divider"></div>

    <!-- Capability pills -->
    <div class="capabilities">
      <div class="cap-pill cap-amber">
        <div class="dot"></div>
        DuckDB-Wasm
      </div>
      <div class="cap-pill cap-violet">
        <div class="dot"></div>
        100% Client-Side
      </div>
      <div class="cap-pill cap-teal">
        <div class="dot"></div>
        Zero-Upload Privacy
      </div>
    </div>
  </div>

  <!-- Bottom accent -->
  <div class="bottom-accent"></div>
</div>

</body>
</html>
